name: CI

# Runs on every push to main and every pull request targeting main,
# on GitHub-hosted ubuntu runners.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Typecheck + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --legacy-peer-deps: vitest's peerOptional @types/node wants >=22 while
      # the app pins @types/node@20 (types-only, safe to skip).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # CI=true (set by GitHub) makes Playwright start its own dev server
      # (no reuse), use 2 workers, and retry once. The suite hits the live
      # backend API, so this job needs outbound network.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
